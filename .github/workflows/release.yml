name: Build and Release PS3 PKG

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build Web Client & PS3 .PKG
        run: npm run build

      - name: Compute Checksum
        id: checksum
        run: |
          cd dist
          sha256sum Jellyfin-PS3-v1.0.0.pkg > Jellyfin-PS3-v1.0.0.pkg.sha256
          cat Jellyfin-PS3-v1.0.0.pkg.sha256

      - name: Publish or Replace GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine release tag (use pushed tag, or default to v1.0.0 on branch push / workflow_dispatch)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi

          echo "Releasing version: $TAG (commit: ${{ github.sha }})"

          # Clean up any existing release for this tag so that previous .pkg, .sha256,
          # and GitHub's automatically generated Source code (zip) and (tar.gz) are fully replaced
          gh release delete "$TAG" --yes --cleanup-tag || true

          # Update the git tag to point to the current commit and force-push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "${{ github.sha }}"
          git push --force origin "$TAG" || true

          # Create fresh GitHub Release with the newly built PKG and checksum
          gh release create "$TAG" \
            --title "Jellyfin PS3 Client $TAG" \
            --target "${{ github.sha }}" \
            --generate-notes \
            dist/Jellyfin-PS3-v1.0.0.pkg \
            dist/Jellyfin-PS3-v1.0.0.pkg.sha256
